[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-dl"
version = "0.1.0"
description = "Multi-platform DJ music downloader - YouTube, Spotify & Apple Music"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp ~= 2026.7.4",
    "gamdl ~= 3.5",
    "mutagen ~= 1.47.0",
    "httpx ~= 0.28.1",
    "typer ~= 0.25.1",
    "rich ~= 15.0.0",
    "pyyaml ~= 6.0.3",
    "spotipy ~= 2.26.0",
    "ytmusicapi ~= 1.12.0",
    "rapidfuzz ~= 3.13.0",
    "librosa ~= 0.11.0",
    "browser-cookie3 ~= 0.20.1",
    "playwright ~= 1.59.0",
]

[project.scripts]
djdl = "dj_dl.cli:main"

[project.optional-dependencies]
dev = [
    "pytest ~= 9.0.3",
    "pytest-asyncio ~= 1.3.0",
    "pytest-cov ~= 7.1.0",
    "ruff ~= 0.15.12",
    "ty ~= 0.0.34",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
